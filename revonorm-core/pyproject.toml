[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "revo-norm-core"
version = "0.7.0"
description = "Rust core for revo-norm (PyO3 bindings)"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "revonorm_core._core"
features = ["pyffi"]
