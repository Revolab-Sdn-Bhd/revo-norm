[package]
name = "revonorm-core"
version = "0.7.5"
edition = "2024"
description = "Rust core for revo-norm: multilingual TTS text normalization (ms/id/en/zh/zh_my)"
repository = "https://github.com/Revolab-Sdn-Bhd/revo-norm"
license = "MIT"

[dependencies]
fancy-regex = "0.19.0"
wasm-bindgen = "0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.23", optional = true }

[features]
default = []
pyffi = ["pyo3", "pyo3/extension-module", "pyo3/generate-import-lib"]

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]
