[package]
name = "revonorm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.19.0"
wasm-bindgen = "0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]
