name: Publish PyPI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revonorm-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: revonorm-core
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: revonorm-core/dist

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: ubuntu-24.04-arm
            target: aarch64-native
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    defaults:
      run:
        working-directory: revonorm-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter '3.9 3.10 3.11 3.12 3.13'
          working-directory: revonorm-core
          manylinux: '2_28'
      - name: Rebuild wheel archives canonically
        # The manylinux x86_64 docker build has twice produced wheels
        # PyPI rejects with 'ZIP archive not accepted: Trailing data'
        # while passing zipfile.testzip in CI — the corruption is in
        # the archive framing, not the entries. A zipfile round-trip
        # writes a clean central directory with nothing after the EOCD.
        run: python ../../scripts/normalize_wheels.py

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: revonorm-core/dist

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      # trusted publishing (OIDC): no PyPI token secret
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          # glob, not regex — one broad pattern covers wheel artifacts + sdist
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Verify wheel integrity (every artifact)
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          files = sorted(glob.glob('dist/*.whl') + glob.glob('dist/*.tar.gz'))
          assert len(files) >= 21, f"expected >=21 artifacts, found {len(files)}"
          for w in files:
              if w.endswith('.whl'):
                  with zipfile.ZipFile(w) as z:
                      bad = z.testzip()
                      assert bad is None, f"CORRUPT {w}: {bad}"
          print(f"all {len(files)} artifacts pass zip integrity")
          EOF
      - name: Smoke a wheel
        run: |
          pip install revonorm --no-index --find-links dist --force-reinstall
          python -c "
          from revonorm import normalize_text
          out = normalize_text('Harga RM10.50 sahaja', 'ms')
          assert out == 'Harga sepuluh ringgit lima puluh sen sahaja', out
          print('wheel OK:', out)
          "
      - name: Publish to PyPI
        if: ${{ !contains(github.ref, 'no-publish') }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: dist/*
