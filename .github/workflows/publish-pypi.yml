name: Publish PyPI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revonorm-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: revonorm-core
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: revonorm-core/dist

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: ubuntu-24.04-arm
            target: aarch64-native
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    defaults:
      run:
        working-directory: revonorm-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter '3.9 3.10 3.11 3.12 3.13'
          working-directory: revonorm-core
          manylinux: '2_28'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: revonorm-core/dist

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*|sdist'
          merge-multiple: true
          path: dist
      - name: Smoke a wheel
        run: |
          pip install revonorm-core --no-index --find-links dist --force-reinstall
          python -c "
          from revonorm_core import normalize_text
          out = normalize_text('Harga RM10.50 sahaja', 'ms')
          assert out == 'Harga sepuluh ringgit lima puluh sen sahaja', out
          print('wheel OK:', out)
          "
      - name: Publish to PyPI
        if: ${{ !contains(github.ref, 'no-publish') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          args: dist/*
