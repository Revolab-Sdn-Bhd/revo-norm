name: Publish npm

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revonorm-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: revonorm-core

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build web (bundler) variant
        run: wasm-pack build --target bundler --out-dir pkg-web --scope revolab

      - name: Build node variant
        run: wasm-pack build --target nodejs --out-dir pkg-node --scope revolab

      - name: Install JS-only README (both variants)
        run: |
          cp npm-README.md pkg-node/README.md
          cp npm-README.md pkg-web/README.md

      - name: Rename packages (crate name stays revonorm-core)
        run: |
          cd pkg-node && npm pkg set name="@revolab/revonorm" && cd ..
          cd pkg-web && npm pkg set name="@revolab/revonorm-web"

      - name: Smoke both variants
        run: |
          node -e "
            const w = require('./pkg-node/revonorm_core.js');
            const out = w.normalize('Harga RM10.50 sahaja', 'ms');
            if (out !== 'Harga sepuluh ringgit lima puluh sen sahaja') {
              throw new Error('node variant mismatch: ' + out);
            }
            console.log('node variant OK:', out);
          "

      - name: Configure npm auth
        if: ${{ !contains(github.ref, 'no-publish') }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish node variant
        if: ${{ !contains(github.ref, 'no-publish') }}
        run: cd pkg-node && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish web variant (bundler) as -web
        if: ${{ !contains(github.ref, 'no-publish') }}
        run: |
          cd pkg-web
          npm pkg set name="@revolab/revonorm-web"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
