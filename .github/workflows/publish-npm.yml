name: Publish npm

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revonorm-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: revonorm-core

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build web (bundler) variant
        run: wasm-pack build --target bundler --out-dir pkg-web --scope revolab

      - name: Build node variant
        run: wasm-pack build --target nodejs --out-dir pkg-node --scope revolab

      - name: Install JS-only README (both variants)
        run: |
          cp npm-README.md pkg-node/README.md
          cp npm-README.md pkg-web/README.md

      - name: Rename packages (crate name stays revonorm-core)
        working-directory: revonorm-core
        run: |
          npm pkg set name="@revolab/revonorm" --prefix pkg-node
          npm pkg set description="Multilingual TTS text normalization for Node.js" --prefix pkg-node
          npm pkg set name="@revolab/revonorm-web" --prefix pkg-web
          npm pkg set description="Multilingual TTS text normalization for browsers" --prefix pkg-web

      - name: Smoke both variants
        run: |
          node -e "
            const w = require('./pkg-node/revonorm_core.js');
            const out = w.normalize('Harga RM10.50 sahaja', 'ms', '');
            if (out !== 'Harga sepuluh ringgit lima puluh sen sahaja') {
              throw new Error('node variant mismatch: ' + out);
            }
            const pron = w.normalize('top up RevoPay RM30K', 'ms', JSON.stringify(
              { pronunciations: { '*': { RevoPay: 'revo pay' } } }
            ));
            if (pron !== 'top up revo pay tiga puluh ribu ringgit') {
              throw new Error('pronunciation override mismatch: ' + pron);
            }
            console.log('node variant OK:', out, '|', pron);
          "

      - name: Configure npm auth
        if: ${{ !contains(github.ref, 'no-publish') }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish node variant
        if: ${{ !contains(github.ref, 'no-publish') }}
        run: cd pkg-node && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish web variant (bundler) as -web
        if: ${{ !contains(github.ref, 'no-publish') }}
        run: |
          cd pkg-web
          npm pkg set name="@revolab/revonorm-web"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal Cargo version (and python package version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_V=$(grep -m1 '^version' revonorm-core/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_V" ]; then
            echo "::error::tag v$TAG != Cargo.toml $CARGO_V — bump Cargo.toml (pyproject inherits it) before tagging"
            exit 1
          fi
          echo "versions aligned: $TAG"
