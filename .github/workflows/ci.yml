name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check revo_norm/

      - name: Checkout private test repo
        uses: actions/checkout@v4
        with:
          repository: Revolab-Sdn-Bhd/revo-norm-tests
          path: revo-norm-tests
          token: ${{ secrets.PRIVATE_TESTS_TOKEN }}

      - name: Run tests
        run: uv run pytest revo-norm-tests/ -q --tb=short

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: revonorm-core

      - uses: astral-sh/setup-uv@v5

      - name: Build engine wheel and snapshot fixtures
        uses: PyO3/maturin-action@v1
        with:
          args: develop --release
          working-directory: revonorm-core

      - name: Regenerate fixtures from the engine
        run: uv run python revonorm-core/tests/gen_fixtures.py

      - name: Native parity tests
        run: cargo test --manifest-path revonorm-core/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path revonorm-core/Cargo.toml -- -D warnings

      - name: wasm build
        run: cargo build --release --manifest-path revonorm-core/Cargo.toml --target wasm32-unknown-unknown
