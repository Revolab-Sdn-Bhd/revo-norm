[project]
name = "revo-norm"
version = "1.0.0"
description = "A text normalization library for TTS applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
# Dev-only workspace: the shipped package is the revonorm wheel built from
# revonorm-core/ (maturin). Nothing here installs to registries.
[tool.uv]
package = false

[tool.hatch.metadata]
# not a hatch project anymore; keep section-free

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.8.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=0.30.1",
]

[tool.ruff]
# Target Python version and code style
target-version = "py39"
line-length = 100
indent-width = 4

# Directories to scan
src = ["revonorm-core/python/revonorm"]

# Exclude directories from scanning
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "revonorm-core/target",
]

[tool.ruff.lint]
# Enable rules by category
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["../revo-norm-tests"]
addopts = "-q --tb=short"
